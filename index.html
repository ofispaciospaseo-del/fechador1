<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechador Digital - Sello Postal Vintage & Neón</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --neon-cyan: #38bdf8;
      --text-color: #f8fafc;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.3rem;
      color: var(--neon-cyan);
    }

    /* Línea de tiempo en vivo */
    .timeline-bar {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-family: monospace;
      margin-bottom: 16px;
    }

    .clock-live {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      word-break: break-all;
    }

    .upload-zone {
      border: 2px dashed #0284c7;
      border-radius: 8px;
      padding: 24px 12px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
      background: #111827;
    }

    .upload-zone p {
      margin: 0;
      font-weight: 600;
      color: #38bdf8;
    }

    input[type="file"] {
      display: none;
    }

    #hiddenCanvas {
      display: none;
    }

    .result-section {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .result-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .download-link {
      display: block;
      width: 100%;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .download-link:active {
      background: #0369a1;
    }

    .hint-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Fechador Digital - Estilo Postal & Neón</h1>

  <!-- Reloj / Línea de tiempo continua (Hora Argentina) -->
  <div class="timeline-bar">
    <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">HORA OFICIAL PROVINCIA DE BS. AS. (ART / UTC-3)</div>
    <div class="clock-live" id="liveClock">00/00/0000 00:00:00.000 ART</div>
  </div>

  <!-- Carga de archivo -->
  <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
    <p>📷 TOCAR AQUÍ PARA SUBIR O TOMAR FOTO</p>
    <input type="file" id="imgInput" accept="image/*" onchange="handleFileSelect(this.files[0])">
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <!-- Resultado renderizado -->
  <div class="result-section" id="resultSection">
    <p style="text-align: left; margin-bottom: 8px; font-weight: bold; color: #cbd5e1;">Comprobante Estampado (Vintage & Neón):</p>
    <img id="finalImage" class="result-img" alt="Imagen estampada">
    
    <a id="downloadBtn" class="download-link" href="#" download="fechado_vintage_neon.png">📥 DESCARGAR IMAGEN ESTAMPADA</a>
    <p class="hint-text">(O mantén presionada la imagen para guardarla en la galería del celular)</p>
  </div>
</div>

<script>
  // Obtener fecha y hora oficial de Argentina con milisegundos
  function getArgentinaFormattedTime(dateObj = new Date()) {
    const ms = String(dateObj.getMilliseconds()).padStart(3, '0');
    
    const options = {
      timeZone: 'America/Argentina/Buenos_Aires',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    };

    const formatter = new Intl.DateTimeFormat('es-AR', options);
    const parts = Object.fromEntries(formatter.formatToParts(dateObj).map(p => [p.type, p.value]));

    const dateStr = `${parts.day}/${parts.month}/${parts.year}`;
    const timeStr = `${parts.hour}:${parts.minute}:${parts.second}.${ms}`;

    return {
      full: `${dateStr} ${timeStr} ART (UTC-3)`,
      dateOnly: dateStr,
      timeOnlyMs: timeStr,
      stampTime: `${parts.hour}:${parts.minute}:${parts.second}.${ms}`
    };
  }

  // Reloj continuo
  function updateLiveClock() {
    const timeData = getArgentinaFormattedTime();
    document.getElementById('liveClock').textContent = timeData.full;
    requestAnimationFrame(updateLiveClock);
  }
  requestAnimationFrame(updateLiveClock);

  function handleFileSelect(file) {
    if (!file) return;

    const timeData = getArgentinaFormattedTime(new Date());
    
    const sizeInKB = (file.size / 1024).toFixed(2);
    const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
    const sizeStr = file.size > 1048576 ? `${sizeInMB} MB (${file.size} bytes)` : `${sizeInKB} KB (${file.size} bytes)`;

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const geoStr = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)} (±${pos.coords.accuracy.toFixed(1)}m)`;
          generateVintageNeonStamp(file, timeData, sizeStr, geoStr);
        },
        () => {
          generateVintageNeonStamp(file, timeData, sizeStr, "GEO: No permitida");
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      generateVintageNeonStamp(file, timeData, sizeStr, "GEO: No soportada");
    }
  }

  function generateVintageNeonStamp(file, timeData, sizeStr, geoStr) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        const imgWidth = img.width;
        const imgHeight = img.height;

        const bannerHeight = Math.max(140, Math.round(imgHeight * 0.18));
        const canvasWidth = imgWidth;
        const canvasHeight = imgHeight + bannerHeight;

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // 1. DIBUJAR LA FOTO ORIGINAL
        ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

        // 2. DIBUJAR BANDA INFERIOR DE METADATOS EN TONO AZUL OSCURO NOCTURNO
        ctx.fillStyle = '#0a1128';
        ctx.fillRect(0, imgHeight, canvasWidth, bannerHeight);

        // Línea divisora celeste neón resplandeciente
        ctx.shadowColor = '#00d8ff';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#00d8ff';
        ctx.lineWidth = Math.max(3, Math.round(imgWidth * 0.005));
        ctx.beginPath();
        ctx.moveTo(0, imgHeight);
        ctx.lineTo(canvasWidth, imgHeight);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset sombra

        const fontSizeTitle = Math.max(16, Math.round(imgWidth * 0.028));
        const fontSizeData = Math.max(13, Math.round(imgWidth * 0.022));
        const marginX = Math.round(imgWidth * 0.03);

        ctx.fillStyle = '#00d8ff';
        ctx.font = `bold ${fontSizeTitle}px monospace`;
        ctx.fillText('FECHADO DIGITAL - CORREO & FE CIERTA', marginX, imgHeight + (bannerHeight * 0.25));

        ctx.fillStyle = '#f8fafc';
        ctx.font = `${fontSizeData}px monospace`;
        ctx.fillText(`FECHA Y HORA (ARG): ${timeData.full}`, marginX, imgHeight + (bannerHeight * 0.48));
        ctx.fillText(`PESO Y TAMAÑO    : ${sizeStr}`, marginX, imgHeight + (bannerHeight * 0.68));
        ctx.fillText(`UBICACIÓN (GEO)  : ${geoStr}`, marginX, imgHeight + (bannerHeight * 0.88));

        // 3. SELLO RECTANGULAR ESTILO CORREO VINTAGE EN AZULES + CELESTE NEÓN
        const stampW = Math.max(200, Math.round(imgWidth * 0.35));
        const stampH = Math.max(110, Math.round(stampW * 0.55));
        const stampX = imgWidth - stampW - Math.round(imgWidth * 0.04);
        const stampY = Math.round(imgHeight * 0.04);

        ctx.save();
        ctx.translate(stampX + (stampW / 2), stampY + (stampH / 2));
        ctx.rotate(-6 * Math.PI / 180); // Leve inclinación de sello postal

        // Fondo azul marino semitransparente estilo tinta
        ctx.fillStyle = 'rgba(10, 25, 47, 0.92)';
        ctx.fillRect(-stampW/2, -stampH/2, stampW, stampH);

        // Marco doble de correo vintage (Azul clásico)
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = Math.max(3, Math.round(stampH * 0.04));
        ctx.strokeRect(-stampW/2, -stampH/2, stampW, stampH);

        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.strokeRect((-stampW/2) + 4, (-stampH/2) + 4, stampW - 8, stampH - 8);

        // Textos del Sello
        const fontHeader = Math.max(10, Math.round(stampH * 0.12));
        const fontNeonTime = Math.max(12, Math.round(stampH * 0.17));
        const fontSub = Math.max(8, Math.round(stampH * 0.09));

        // Título del sello (Azul postal vintage)
        ctx.fillStyle = '#60a5fa';
        ctx.textAlign = 'center';
        ctx.font = `bold ${fontHeader}px sans-serif`;
        ctx.fillText('ESTAMPADO DE FECHA', 0, -stampH * 0.28);

        // Fecha en azul claro
        ctx.font = `${fontSub}px monospace`;
        ctx.fillText(`FECHA: ${timeData.dateOnly}`, 0, -stampH * 0.10);

        // HORA HASTA MILISEGUNDOS EN CELESTE NEÓN BRILLANTE (Efecto Resplandor)
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#00f0ff';
        ctx.font = `bold ${fontNeonTime}px monospace`;
        ctx.fillText(timeData.stampTime, 0, stampH * 0.18);
        ctx.shadowBlur = 0; // Reset glow

        // Pie del sello postal vintage
        ctx.fillStyle = '#93c5fd';
        ctx.font = `bold ${fontSub}px sans-serif`;
        ctx.fillText('PROVINCIA DE BS. AS. • ART', 0, stampH * 0.38);

        ctx.restore();

        // 4. GENERAR IMAGEN FINAL
        const dataUrl = canvas.toDataURL('image/png');
        
        const finalImg = document.getElementById('finalImage');
        finalImg.src = dataUrl;

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = dataUrl;
        downloadBtn.download = `Fechado_Vintage_Neon_${Date.now()}.png`;

        document.getElementById('resultSection').style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
